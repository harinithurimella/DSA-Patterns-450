<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Reference</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Fraunces:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #22222a;
    --border: #2e2e38;
    --accent: #a78bfa;
    --accent2: #34d399;
    --accent3: #fb923c;
    --accent4: #60a5fa;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --tag-bg: #1e1e28;
    --code-bg: #13131a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* SIDEBAR */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    z-index: 100;
  }
  .sidebar-logo {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .sidebar-logo span { color: var(--text); font-size: 12px; font-family: 'DM Sans'; font-weight: 300; display: block; margin-top: 2px; }
  .sidebar-search {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-search input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    color: var(--text);
    font-family: 'DM Sans';
    outline: none;
    transition: border-color .2s;
  }
  .sidebar-search input::placeholder { color: var(--muted); }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-section { padding: 6px 0; }
  .sidebar-heading {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 20px 4px;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 20px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all .15s;
    text-decoration: none;
  }
  .sidebar-link:hover { color: var(--text); background: var(--surface2); }
  .sidebar-link.active { color: var(--accent); border-left-color: var(--accent); background: rgba(167,139,250,0.06); }
  .sidebar-link .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background .15s;
  }
  .sidebar-link.active .dot, .sidebar-link:hover .dot { background: currentColor; }
  .sidebar-footer {
    margin-top: auto;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .add-btn {
    width: 100%;
    padding: 8px;
    background: var(--accent);
    color: #0f0f11;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans';
    cursor: pointer;
    transition: opacity .2s;
  }
  .add-btn:hover { opacity: 0.85; }

  /* MAIN */
  .main {
    margin-left: 240px;
    flex: 1;
    padding: 0;
  }
  .topbar {
    position: sticky; top: 0;
    background: rgba(15,15,17,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    z-index: 50;
  }
  .topbar-tabs { display: flex; gap: 2px; }
  .topbar-tab {
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: 'DM Sans';
    transition: all .15s;
  }
  .topbar-tab:hover { color: var(--text); background: var(--surface2); }
  .topbar-tab.active { color: var(--text); background: var(--surface2); font-weight: 500; }
  .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .filter-tag {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    background: none;
    font-family: 'DM Sans';
  }
  .filter-tag:hover, .filter-tag.active { border-color: var(--accent); color: var(--accent); }

  /* CONTENT */
  .content { padding: 28px 32px; }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }
  .section-subtitle { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .2s, transform .2s;
    cursor: pointer;
    position: relative;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .card-title-wrap { flex: 1; }
  .card-title { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
  .card-cat {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .cat-ds { background: rgba(167,139,250,0.12); color: var(--accent); }
  .cat-algo { background: rgba(52,211,153,0.12); color: var(--accent2); }
  .cat-pattern { background: rgba(251,146,60,0.12); color: var(--accent3); }
  .cat-custom { background: rgba(96,165,250,0.12); color: var(--accent4); }
  .card-actions { display: flex; gap: 4px; }
  .card-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .card-btn:hover { border-color: var(--accent); color: var(--accent); }
  .card-body { padding: 14px 18px 16px; }
  .card-desc { font-size: 13px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
  .card-complexity { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .cx-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--code-bg);
    color: var(--accent2);
    border: 1px solid var(--border);
  }
  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--tag-bg);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .card-steps {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .step-item {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 12px;
    color: var(--muted);
  }
  .step-num {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #a0a0c0;
    overflow-x: auto;
    white-space: pre;
    line-height: 1.7;
  }
  .kw { color: #c084fc; }
  .fn { color: #60a5fa; }
  .cm { color: #4b5563; }
  .st { color: #34d399; }
  .num { color: #fb923c; }

  /* DETAIL PANEL */
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .detail-overlay.open { display: flex; }
  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: min(720px, 95vw);
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px 32px;
    position: relative;
  }
  .detail-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .detail-close:hover { color: var(--text); border-color: var(--accent); }
  .detail-title { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .detail-desc { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.7; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 10px; }
  .use-cases { display: flex; flex-wrap: wrap; gap: 6px; }
  .use-case {
    padding: 5px 12px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text);
  }

  /* ADD MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: min(560px, 95vw);
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px 28px;
  }
  .modal h2 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.8px; }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    font-family: 'DM Sans';
    outline: none;
    transition: border-color .2s;
  }
  .form-textarea { font-family: 'JetBrains Mono', monospace; font-size: 12px; resize: vertical; min-height: 80px; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface2); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    font-family: 'DM Sans';
    transition: all .15s;
  }
  .btn-cancel:hover { color: var(--text); border-color: var(--text); }
  .btn-save {
    padding: 8px 22px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0f0f11;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'DM Sans';
    transition: opacity .15s;
  }
  .btn-save:hover { opacity: 0.85; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* BOOKMARKS */
  .bookmark-btn { font-size: 16px; cursor: pointer; background: none; border: none; color: var(--muted); transition: color .15s; }
  .bookmark-btn.bookmarked { color: #fbbf24; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    z-index: 500;
    display: none;
    animation: fadeUp .3s ease;
  }
  .toast.show { display: block; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

  .hidden { display: none !important; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      DSA Ref
      <span>Your Personal Cheatsheet</span>
    </div>
    <div class="sidebar-search">
      <input type="text" id="globalSearch" placeholder="Search anything..." oninput="doSearch(this.value)">
    </div>

    <div class="sidebar-section">
      <div class="sidebar-heading">Browse</div>
      <div class="sidebar-link active" onclick="switchView('all', this)"><span class="dot"></span>All Topics</div>
      <div class="sidebar-link" onclick="switchView('bookmarks', this)"><span class="dot"></span>⭐ Bookmarked</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-heading">Categories</div>
      <div class="sidebar-link" onclick="filterCat('Data Structure', this)"><span class="dot"></span>Data Structures</div>
      <div class="sidebar-link" onclick="filterCat('Algorithm', this)"><span class="dot"></span>Algorithms</div>
      <div class="sidebar-link" onclick="filterCat('Pattern', this)"><span class="dot"></span>Patterns</div>
      <div class="sidebar-link" onclick="filterCat('Custom', this)"><span class="dot"></span>My Notes</div>
    </div>

    <div class="sidebar-footer">
      <button class="add-btn" onclick="openAddModal()">+ Add New Topic</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-tabs">
        <button class="topbar-tab active" onclick="setLayout('grid',this)">⊞ Grid</button>
        <button class="topbar-tab" onclick="setLayout('compact',this)">☰ Compact</button>
      </div>
      <div class="topbar-right">
        <button class="filter-tag" onclick="toggleDiff('Easy',this)">Easy</button>
        <button class="filter-tag" onclick="toggleDiff('Medium',this)">Medium</button>
        <button class="filter-tag" onclick="toggleDiff('Hard',this)">Hard</button>
      </div>
    </div>

    <div class="content">
      <div id="viewTitle">
        <div class="section-title" id="mainTitle">All Topics</div>
        <div class="section-subtitle" id="mainSub">Browse all data structures, algorithms and patterns</div>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="empty hidden" id="emptyState">
        <div class="empty-icon">🔍</div>
        <p>Nothing found. Try a different search or add a new topic.</p>
      </div>
    </div>
  </main>
</div>

<!-- DETAIL PANEL -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetailPanel()">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <h2 id="modalTitle">Add New Topic</h2>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input class="form-input" id="fTitle" placeholder="e.g. Binary Search">
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select" id="fCat">
        <option value="Data Structure">Data Structure</option>
        <option value="Algorithm">Algorithm</option>
        <option value="Pattern">Pattern</option>
        <option value="Custom">Custom Note</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Difficulty</label>
      <select class="form-select" id="fDiff">
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Short Description</label>
      <input class="form-input" id="fDesc" placeholder="One-line summary">
    </div>
    <div class="form-group">
      <label class="form-label">Full Explanation</label>
      <textarea class="form-textarea" id="fExplain" rows="4" placeholder="Detailed explanation..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Time Complexity (comma separated)</label>
      <input class="form-input" id="fTime" placeholder="O(1), O(log n), O(n)">
    </div>
    <div class="form-group">
      <label class="form-label">Space Complexity</label>
      <input class="form-input" id="fSpace" placeholder="O(n)">
    </div>
    <div class="form-group">
      <label class="form-label">Steps / Key Points (one per line)</label>
      <textarea class="form-textarea" id="fSteps" rows="4" placeholder="Step 1&#10;Step 2&#10;Step 3"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Use Cases (comma separated)</label>
      <input class="form-input" id="fUseCases" placeholder="Binary search, Sorted arrays, Two pointers">
    </div>
    <div class="form-group">
      <label class="form-label">Code Snippet (optional)</label>
      <textarea class="form-textarea" id="fCode" rows="5" placeholder="def binary_search(arr, target):&#10;    ..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Tags (comma separated)</label>
      <input class="form-input" id="fTags" placeholder="array, search, divide-conquer">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModalBtn()">Cancel</button>
      <button class="btn-save" onclick="saveTopic()">Save Topic</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
const DEFAULT_DATA = [
  {
    id: 1, title: "Array", category: "Data Structure", difficulty: "Easy",
    icon: "📦", desc: "Contiguous memory storing elements of the same type, accessible by index.",
    explain: "Arrays are the most fundamental data structure. They store elements in a contiguous block of memory, allowing O(1) access by index. Fixed-size in most languages, but dynamic arrays (like Python lists, Java ArrayList) resize automatically. Prefix sum technique is a powerful pattern built on arrays.",
    time: ["O(1) access", "O(n) search", "O(n) insert/delete mid"],
    space: "O(n)",
    steps: ["Declare with fixed size or use dynamic array", "Access elements by index (0-based)", "Use prefix sums for range query optimization", "Two pointers for sorted array problems"],
    useCases: ["Two pointers", "Sliding window", "Prefix sums", "Kadane's algorithm", "Matrix problems"],
    code: `# Prefix Sum
prefix = [0] * (len(arr) + 1)
for i in range(len(arr)):
    prefix[i+1] = prefix[i] + arr[i]

# Range sum query in O(1)
range_sum = prefix[r+1] - prefix[l]`,
    tags: ["linear", "random-access", "contiguous"]
  },
  {
    id: 2, title: "HashMap / HashSet", category: "Data Structure", difficulty: "Easy",
    icon: "🗂", desc: "Key-value store with O(1) average lookup, insert, and delete.",
    explain: "Hash maps use a hash function to map keys to indices. Collisions are handled via chaining or open addressing. HashSet is a hashmap without values — just for membership checks. Both are essential for frequency counting, caching, and eliminating O(n²) solutions down to O(n).",
    time: ["O(1) avg insert", "O(1) avg lookup", "O(n) worst case"],
    space: "O(n)",
    steps: ["Use dict{} in Python or HashMap in Java", "For frequency count: map[key] = map.get(key,0)+1", "For two-sum: store complement and check existence", "For deduplication: use a set"],
    useCases: ["Two Sum", "Anagram check", "Frequency count", "Memoization", "Deduplication"],
    code: `# Two Sum in O(n)
def two_sum(nums, target):
    seen = {}
    for i, n in enumerate(nums):
        if target - n in seen:
            return [seen[target-n], i]
        seen[n] = i`,
    tags: ["hash", "O(1)", "key-value"]
  },
  {
    id: 3, title: "Stack", category: "Data Structure", difficulty: "Easy",
    icon: "📚", desc: "LIFO structure — last in, first out. Push and pop from the same end.",
    explain: "Stacks are perfect for problems involving 'undo', matching pairs, or tracking state that needs to be reversed. In Python, a list works as a stack (append/pop). Monotonic stacks keep the stack in increasing or decreasing order and solve many 'next greater/smaller' problems.",
    time: ["O(1) push", "O(1) pop", "O(1) peek"],
    space: "O(n)",
    steps: ["Use list in Python: stack = []", "push: stack.append(x)", "pop: stack.pop()", "peek: stack[-1]"],
    useCases: ["Balanced parentheses", "Next greater element", "Monotonic stack", "DFS iterative", "Undo operations"],
    code: `# Valid Parentheses
def is_valid(s):
    stack, match = [], {')':'(',']':'[','}':'{'}
    for c in s:

// ─── STATE ────────────────────────────────────────────────────────────────────
let topics = [];
let bookmarks = new Set();
let currentView = 'all';
let currentCat = null;
let currentDiffs = new Set();
let searchQuery = '';
let editingId = null;
let layoutMode = 'grid';

function loadData() {
  const stored = localStorage.getItem('dsa_topics');
  topics = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  const bk = localStorage.getItem('dsa_bookmarks');
  bookmarks = bk ? new Set(JSON.parse(bk)) : new Set();
}
function saveData() {
  localStorage.setItem('dsa_topics', JSON.stringify(topics));
  localStorage.setItem('dsa_bookmarks', JSON.stringify([...bookmarks]));
}

// ─── FILTERING ────────────────────────────────────────────────────────────────
function getFiltered() {
  return topics.filter(t => {
    if (currentView === 'bookmarks' && !bookmarks.has(t.id)) return false;
    if (currentCat && t.category !== currentCat) return false;
    if (currentDiffs.size > 0 && !currentDiffs.has(t.difficulty)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return t.title.toLowerCase().includes(q) ||
        t.desc.toLowerCase().includes(q) ||
        (t.tags || []).some(tag => tag.toLowerCase().includes(q)) ||
        t.category.toLowerCase().includes(q);
    }
    return true;
  });
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
const catColors = { 'Data Structure': 'cat-ds', 'Algorithm': 'cat-algo', 'Pattern': 'cat-pattern', 'Custom': 'cat-custom' };

function renderCards() {
  const filtered = getFiltered();
  const grid = document.getElementById('cardsGrid');
  const empty = document.getElementById('emptyState');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  if (layoutMode === 'compact') {
    grid.style.gridTemplateColumns = '1fr';
  } else {
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(320px, 1fr))';
  }

  grid.innerHTML = filtered.map(t => {
    const isBookmarked = bookmarks.has(t.id);
    const steps = (t.steps || []).slice(0,3).map((s,i) =>
      `<div class="step-item"><div class="step-num">${i+1}</div><div>${s}</div></div>`
    ).join('');
    const tags = (t.tags||[]).slice(0,4).map(tag => `<span class="tag">${tag}</span>`).join('');
    const cxBadges = (t.time||[]).slice(0,2).map(c => `<span class="cx-badge">${c}</span>`).join('');

    return `
    <div class="card" onclick="openDetail(${t.id})">
      <div class="card-header">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <div class="card-icon" style="background:var(--surface2)">${t.icon||'📄'}</div>
          <div class="card-title-wrap">
            <div class="card-title">${t.title}</div>
            <span class="card-cat ${catColors[t.category]||'cat-custom'}">${t.category}</span>
          </div>
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="bookmark-btn ${isBookmarked?'bookmarked':''}" onclick="toggleBookmark(${t.id},this)" title="Bookmark">⭐</button>
          <button class="card-btn" onclick="openEditModal(${t.id})" title="Edit">✏️</button>
          <button class="card-btn" onclick="deleteTopic(${t.id})" title="Delete">🗑</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-desc">${t.desc}</div>
        <div class="card-complexity">${cxBadges}</div>
        <div class="card-steps">${steps}</div>
        <div class="card-tags" style="margin-top:10px">${tags}
          <span style="font-size:11px;padding:2px 8px;border-radius:20px;color:${diffColors[t.difficulty]};border:1px solid ${diffColors[t.difficulty]}33;margin-left:auto">${t.difficulty}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ─── DETAIL ───────────────────────────────────────────────────────────────────
function openDetail(id) {
  const t = topics.find(x => x.id === id);
  if (!t) return;
  const steps = (t.steps||[]).map((s,i) =>
    `<div class="step-item"><div class="step-num">${i+1}</div><div>${s}</div></div>`
  ).join('');
  const useCases = (t.useCases||[]).map(u => `<div class="use-case">${u}</div>`).join('');
  const cxBadges = (t.time||[]).map(c => `<span class="cx-badge">${c}</span>`).join('');
  const spBadge = t.space ? `<span class="cx-badge" style="color:var(--accent3)">Space: ${t.space}</span>` : '';
  const tags = (t.tags||[]).map(tag => `<span class="tag">${tag}</span>`).join('');
  const codeHtml = t.code ? `
    <div class="detail-section">
      <h3>Code Example</h3>
      <div class="code-block">${escapeHtml(t.code)}</div>
    </div>` : '';

  document.getElementById('detailContent').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <div style="font-size:36px">${t.icon||'📄'}</div>
      <div>
        <div class="detail-title">${t.title}</div>
        <span class="card-cat ${catColors[t.category]||'cat-custom'}" style="font-size:12px">${t.category}</span>
        <span style="margin-left:8px;font-size:12px;color:${diffColors[t.difficulty]}">${t.difficulty}</span>
      </div>
    </div>
    <div class="detail-desc">${t.explain || t.desc}</div>
    <div class="detail-section">
      <h3>Complexity</h3>
      <div class="card-complexity">${cxBadges}${spBadge}</div>
    </div>
    <div class="detail-section">
      <h3>Steps / Key Points</h3>
      <div class="card-steps">${steps}</div>
    </div>
    ${useCases ? `<div class="detail-section"><h3>Use Cases</h3><div class="use-cases">${useCases}</div></div>` : ''}
    ${codeHtml}
    <div class="detail-section"><h3>Tags</h3><div class="card-tags">${tags}</div></div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(e) {
  if (e.target === document.getElementById('detailOverlay')) closeDetailPanel();
}
function closeDetailPanel() {
  document.getElementById('detailOverlay').classList.remove('open');
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add New Topic';
  ['fTitle','fDesc','fExplain','fTime','fSpace','fSteps','fUseCases','fCode','fTags'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCat').value = 'Data Structure';
  document.getElementById('fDiff').value = 'Easy';
  document.getElementById('modalOverlay').classList.add('open');
}
function openEditModal(id) {
  const t = topics.find(x => x.id === id);
  if (!t) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Topic';
  document.getElementById('fTitle').value = t.title;
  document.getElementById('fCat').value = t.category;
  document.getElementById('fDiff').value = t.difficulty;
  document.getElementById('fDesc').value = t.desc;
  document.getElementById('fExplain').value = t.explain || '';
  document.getElementById('fTime').value = (t.time||[]).join(', ');
  document.getElementById('fSpace').value = t.space || '';
  document.getElementById('fSteps').value = (t.steps||[]).join('\n');
  document.getElementById('fUseCases').value = (t.useCases||[]).join(', ');
  document.getElementById('fCode').value = t.code || '';
  document.getElementById('fTags').value = (t.tags||[]).join(', ');
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
}
function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function saveTopic() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { showToast('Please enter a title'); return; }
  const obj = {
    id: editingId || Date.now(),
    title,
    category: document.getElementById('fCat').value,
    difficulty: document.getElementById('fDiff').value,
    icon: '📄',
    desc: document.getElementById('fDesc').value.trim(),
    explain: document.getElementById('fExplain').value.trim(),
    time: document.getElementById('fTime').value.split(',').map(s=>s.trim()).filter(Boolean),
    space: document.getElementById('fSpace').value.trim(),
    steps: document.getElementById('fSteps').value.split('\n').map(s=>s.trim()).filter(Boolean),
    useCases: document.getElementById('fUseCases').value.split(',').map(s=>s.trim()).filter(Boolean),
    code: document.getElementById('fCode').value.trim(),
    tags: document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
  };
  // auto icon
  const iconMap = {'Data Structure':'📦','Algorithm':'⚙️','Pattern':'🗺','Custom':'📝'};
  obj.icon = iconMap[obj.category] || '📄';

  if (editingId) {
    const idx = topics.findIndex(t => t.id === editingId);
    topics[idx] = obj;
    showToast('Topic updated!');
  } else {
    topics.push(obj);
    showToast('Topic added!');
  }
  saveData();
  closeModalBtn();
  renderCards();
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function deleteTopic(id) {
  if (!confirm('Delete this topic?')) return;
  topics = topics.filter(t => t.id !== id);
  bookmarks.delete(id);
  saveData();
  renderCards();
  showToast('Deleted');
}
function toggleBookmark(id, btn) {
  if (bookmarks.has(id)) {
    bookmarks.delete(id);
    btn.classList.remove('bookmarked');
    showToast('Removed from bookmarks');
  } else {
    bookmarks.add(id);
    btn.classList.add('bookmarked');
    showToast('Bookmarked!');
  }
  saveData();
  if (currentView === 'bookmarks') renderCards();
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function switchView(view, el) {
  currentView = view; currentCat = null;
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  el.classList.add('active');
  const titles = { all: ['All Topics', 'Browse all data structures, algorithms and patterns'], bookmarks: ['Bookmarked', 'Your saved topics'] };
  document.getElementById('mainTitle').textContent = titles[view][0];
  document.getElementById('mainSub').textContent = titles[view][1];
  renderCards();
}
function filterCat(cat, el) {
  currentView = 'all'; currentCat = cat;
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('mainTitle').textContent = cat + 's';
  document.getElementById('mainSub').textContent = `All ${cat.toLowerCase()} topics`;
  renderCards();
}
function toggleDiff(diff, btn) {
  if (currentDiffs.has(diff)) { currentDiffs.delete(diff); btn.classList.remove('active'); }
  else { currentDiffs.add(diff); btn.classList.add('active'); }
  renderCards();
}
function doSearch(q) {
  searchQuery = q;
  currentCat = null;
  renderCards();
}
function setLayout(mode, btn) {
  layoutMode = mode;
  document.querySelectorAll('.topbar-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadData();
renderCards();
</script>
</body>
</html>
